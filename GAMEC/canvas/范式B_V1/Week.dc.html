<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
  <style>
    :root{
      --bg-fallback:#EEF1F6; --panel-ref:#F2F4F8; --accent:#2F6BFF; --accent-ink:#FFFFFF;
      --divider:rgba(15,23,42,.08); --hover:rgba(15,23,42,.05);
      --text-1:#17202E; --text-2:rgba(23,32,46,.62); --text-3:rgba(23,32,46,.50); --text-muted:rgba(23,32,46,.30);
      --ev-release:#2F6BFF; --ev-purchase:#0E9E68; --ev-achieve-fallback:#6D4AE0;
      --axis:rgba(15,23,42,.16); --stem:rgba(15,23,42,.14);
    }
    *{box-sizing:border-box;}
    body{margin:0;width:1440px;height:900px;background:var(--bg-fallback);color:var(--text-1);
      font-family:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:#2F6BFF;} a:hover{color:#1B4FD8;}
    .num{font-family:"Space Grotesk",system-ui,sans-serif;}
    .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;}
    .label{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.10em;
      text-transform:uppercase;color:var(--text-3);}
    .dot{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(15,23,42,.14);}
    .tsclock{display:flex;align-items:baseline;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
      font-variant-numeric:tabular-nums;}
    .tsclock .ctx{font-size:26px;font-weight:400;color:rgba(23,32,46,.56);letter-spacing:.02em;}
    .tsclock .sep{margin:0 5px;font-size:20px;color:rgba(23,32,46,.40);}
    .tsclock .hit{font-size:44px;font-weight:500;color:var(--text-1);letter-spacing:.01em;}
    .gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.45);
      border:1px solid rgba(15,23,42,.10);box-shadow:0 2px 10px rgba(15,23,42,.08),inset 0 1px 0 rgba(255,255,255,.9);
      display:flex;align-items:center;justify-content:center;color:var(--text-2);text-decoration:none;cursor:pointer;
      transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
    .gear svg{transition:transform .5s cubic-bezier(.2,.8,.2,1);}
    .gear:hover{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(47,107,255,.38);}
    .gear:hover svg{transform:rotate(35deg);}
    .gear:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    .gear::after{content:"设置";position:absolute;left:50%;bottom:calc(100% + 10px);
      padding:5px 9px;border-radius:8px;background:rgba(23,32,46,.92);color:#fff;
      font-family:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
      font-size:11.5px;font-weight:500;letter-spacing:.02em;line-height:1.4;white-space:nowrap;
      opacity:0;transform:translate(-50%,4px);transition:opacity .16s ease,transform .16s ease;
      pointer-events:none;}
    .gear:hover::after{opacity:1;transform:translate(-50%,0);}
    .seg{height:38px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(15,23,42,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 3px rgba(15,23,42,.05);
      display:flex;align-items:center;padding:3px;gap:2px;}
    .seg>div{min-width:52px;height:30px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;
      font-size:13.5px;font-weight:500;letter-spacing:.06em;color:rgba(23,32,46,.74);cursor:pointer;
      transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
    .seg>div:hover{background:rgba(255,255,255,.85);color:#17202E;}
    .seg>div.on{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(47,107,255,.32),inset 0 1px 0 rgba(255,255,255,.28);}
    .seg>div.on:hover{background:#527EF5;color:#fff;}
    .seg>div:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    /* 平移按钮（与档位切换器同排）。滚轮行为见下方 .edge-hint 注释。 */
    .iconbtn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.30);
      border:1px solid rgba(15,23,42,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.90);
      display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;padding:0;
      transition:background .15s ease,color .15s ease;}
    .iconbtn:hover{background:rgba(255,255,255,.65);color:var(--text-1);}
    .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    /* 边缘提示带：左右各一条，常驻。
       轴的平移有三条路子——点两侧的平移按钮、直接滚轮（无需按住 Ctrl）、
       或把指针停在这条带子上 ~150ms 后自动滚动；Ctrl + 滚轮则是换档（日/周/月）。 */
    .edge-hint{position:absolute;top:96px;bottom:34px;width:64px;pointer-events:none;
      display:flex;align-items:center;justify-content:center;color:var(--text-3);
      background:linear-gradient(270deg,rgba(15,23,42,.07),rgba(15,23,42,0));}
    .edge-hint.left{left:0;transform:scaleX(-1);}
    .edge-hint.right{right:0;}
    /* 环境标识：常驻底栏，非 LIVE 一律中性灰（05 §8.1） */
    .mode-badge{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.10em;
      line-height:1;padding:4px 8px;border-radius:999px;flex:none;
      background:rgba(47,107,255,.12);color:var(--accent);}
    .mode-badge.neutral{background:rgba(15,23,42,.06);color:var(--text-2);}
    .shot{width:96px;height:54px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(15,23,42,.14);}
    .axis{position:absolute;left:0;right:0;top:480px;height:1px;background:var(--axis);}
    .mid{position:absolute;left:720px;top:96px;bottom:34px;width:1px;background:rgba(15,23,42,.05);}
    /* ---- 悬浮演示卡（周档 Hover）：封面轮播 + 点击放大灯箱 ---- */
    .cover-frame{position:relative;overflow:hidden;cursor:zoom-in;outline:none;-webkit-tap-highlight-color:transparent;}
    .cover-frame:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    .cover-frame:hover{box-shadow:0 0 0 1.5px rgba(23,32,46,.28),0 6px 14px rgba(23,32,46,.12);}
    .cover-track{display:flex;height:100%;transition:transform .38s cubic-bezier(.22,.76,.24,1);will-change:transform;}
    .cover-slide{flex:0 0 auto;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
    .cover-dots{display:flex;gap:6px;justify-content:center;margin-top:8px;}
    .cdot{width:6px;height:6px;border-radius:50%;background:rgba(15,23,42,.18);transition:background .2s ease;}
    .cdot.on{background:var(--accent);}
    .lb{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;
      background:rgba(23,32,46,.36);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
    .lb.open{display:flex;}
    .lb-card{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:scale(.94) translateY(8px);
      transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.25,1);}
    .lb.open .lb-card{opacity:1;transform:none;}
    .lb-stage{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 26px 70px rgba(15,23,42,.38);}
    .lb-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.22,.76,.24,1);will-change:transform;}
    .lb-slide{flex:0 0 auto;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;}
    .lb-slide .t{font-family:"Space Grotesk",system-ui,sans-serif;font-size:46px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.95);}
    .lb-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.08);color:var(--text-1);display:flex;align-items:center;justify-content:center;
      cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.14);z-index:2;transition:background .16s ease;}
    .lb-close:hover{background:var(--accent);color:#fff;}
    .lb-close:focus-visible{outline:2px solid #fff;outline-offset:2px;}
    .lb-zone{position:absolute;top:0;bottom:0;width:528px;display:flex;align-items:center;border:0;padding:0;cursor:pointer;
      color:#fff;z-index:1;background:transparent;transition:background .2s ease;}
    .lb-zone[data-dir="prev"]{left:0;justify-content:flex-end;padding-right:34px;}
    .lb-zone[data-dir="next"]{right:0;justify-content:flex-start;padding-left:34px;}
    .lb-zone:hover[data-dir="prev"],.lb-zone:focus-visible[data-dir="prev"]{background:linear-gradient(90deg,rgba(23,32,46,.20),rgba(23,32,46,0) 82%);}
    .lb-zone:hover[data-dir="next"],.lb-zone:focus-visible[data-dir="next"]{background:linear-gradient(270deg,rgba(23,32,46,.20),rgba(23,32,46,0) 82%);}
    .lb-zone:focus-visible{outline:2px solid #fff;outline-offset:-2px;}
    .lb-zone .zb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.36),0 8px 22px rgba(15,23,42,.24);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:scale(.82);
      transition:opacity .18s ease,transform .2s cubic-bezier(.2,.8,.25,1),background .16s ease;}
    .lb-zone:hover .zb,.lb-zone:focus-visible .zb{opacity:1;transform:none;background:rgba(255,255,255,.30);}
    .lb-meta{display:flex;flex-direction:column;align-items:center;gap:10px;}
    .lb-meta .cdot{background:rgba(255,255,255,.38);}
    .lb-meta .cdot.on{background:#fff;}
    .lb-hint{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.85);}
  </style>

(function(){
  var tries=0;
  function boot(){
    var frame=document.getElementById('cov-frame');
    var track=document.getElementById('cov-track');
    if(!frame||!track){ if(tries++<100){ setTimeout(boot,150); } return; }
    var slides=[].slice.call(track.children);
    var dotsEl=document.getElementById('cov-dots');
    var dots=dotsEl?[].slice.call(dotsEl.children):[];
    var chip=document.getElementById('cov-chip');
    var n=slides.length; if(!n){ return; }
    var sw=slides[0].offsetWidth||96;
    var i=0,last=0,acc=0,lastFocus=null,lbOpen=false;
    var lb=null,lbt=null,lbTr=null;
    function dotsSync(){
      for(var d=0;d<dots.length;d++){ if(d===i){dots[d].classList.add('on');} else {dots[d].classList.remove('on');} }
      if(chip){ chip.textContent=(i+1)+'/'+n; }
      if(lb){
        var bd=lb.querySelectorAll('.lb-meta .cdot');
        for(var b=0;b<bd.length;b++){ if(b===i){bd[b].classList.add('on');} else {bd[b].classList.remove('on');} }
      }
    }
    function snap(to){
      i=(to+n)%n;
      track.style.transform='translateX('+(-i*sw)+'px)';
      if(lbTr){ lbTr.style.transform='translateX('+(-i*336)+'px)'; }
      dotsSync();
    }
    function stepWheel(e){
      if(e){ e.preventDefault(); }
      var dx=(Math.abs(e.deltaX)>Math.abs(e.deltaY))?e.deltaX:e.deltaY;
      acc+=dx;
      if(Math.abs(acc)>=28||(acc!==0&&(Date.now()-last)>=260)){
        var dir=acc>0?1:-1; acc=0; last=Date.now(); snap(i+dir);
      }
    }
    lb=document.createElement('div'); lb.className='lb';
    var card=document.createElement('div'); card.className='lb-card';
    var stage=document.createElement('div'); stage.className='lb-stage';
    lbt=document.createElement('div'); lbt.className='lb-track';
    stage.appendChild(lbt);
    var meta=document.createElement('div'); meta.className='lb-meta';
    var dots2=document.createElement('div'); dots2.className='cover-dots'; dots2.style.marginTop='0';
    for(var s=0;s<n;s++){ var sp=document.createElement('span'); sp.className='cdot'; dots2.appendChild(sp); }
    var hint=document.createElement('div'); hint.className='lb-hint'; hint.textContent='滚轮 / 点击左右侧切换 · ESC 关闭';
    meta.appendChild(dots2); meta.appendChild(hint);
    card.appendChild(stage); card.appendChild(meta); lb.appendChild(card);
    var closeBtn=document.createElement('button'); closeBtn.className='lb-close'; closeBtn.type='button';
    closeBtn.setAttribute('aria-label','关闭放大');
    closeBtn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    lb.appendChild(closeBtn);
    document.body.appendChild(lb);
    var zPrev=document.createElement('button'); zPrev.type='button'; zPrev.className='lb-zone'; zPrev.setAttribute('data-dir','prev');
    zPrev.setAttribute('aria-label','上一张');
    zPrev.innerHTML='<span class="zb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 6.4 9 12l5.6 5.6"/></svg></span>';
    var zNext=document.createElement('button'); zNext.type='button'; zNext.className='lb-zone'; zNext.setAttribute('data-dir','next');
    zNext.setAttribute('aria-label','下一张');
    zNext.innerHTML='<span class="zb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 6.4 15 12l-5.6 5.6"/></svg></span>';
    lb.appendChild(zPrev); lb.appendChild(zNext);
    lbTr=lbt;
    function buildBig(){
      lbTr.innerHTML='';
      for(var s2=0;s2<n;s2++){
        var d=document.createElement('div'); d.className='lb-slide'; d.style.width='336px';
        d.style.backgroundImage=getComputedStyle(slides[s2]).backgroundImage;
        var t=document.createElement('span'); t.className='t';
        t.textContent=(slides[s2].textContent||'').trim(); d.appendChild(t);
        lbTr.appendChild(d);
      }
      stage.style.width='336px'; stage.style.height='504px';
    }
    function openLB(){
      if(lbOpen){ return; }
      lbOpen=true; lastFocus=frame;
      buildBig();
      lbTr.style.transition='none';
      lbTr.style.transform='translateX('+(-i*336)+'px)';
      dotsSync();
      lb.classList.add('open');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ lbTr.style.transition=''; }); });
      try{ closeBtn.focus({preventScroll:true}); }catch(err){ closeBtn.focus(); }
    }
    function closeLB(){
      if(!lbOpen){ return; }
      lbOpen=false; lb.classList.remove('open');
      if(lastFocus){ try{ lastFocus.focus({preventScroll:true}); }catch(err){ lastFocus.focus(); } }
    }
    frame.addEventListener('click',openLB);
    frame.addEventListener('wheel',stepWheel,{passive:false});
    frame.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); snap(i+1); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); snap(i-1); }
      else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openLB(); }
    });
    lb.addEventListener('wheel',stepWheel,{passive:false});
    lb.addEventListener('click',function(e){ if(e.target===lb){ closeLB(); } });
    closeBtn.addEventListener('click',closeLB);
    zPrev.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); snap(i-1); });
    zNext.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); snap(i+1); });
    window.addEventListener('keydown',function(e){
      if(e.key==='Escape'){ closeLB(); }
      else if(lbOpen&&(e.key==='ArrowRight'||e.key==='ArrowDown')){ e.preventDefault(); snap(i+1); }
      else if(lbOpen&&(e.key==='ArrowLeft'||e.key==='ArrowUp')){ e.preventDefault(); snap(i-1); }
    });
  }
